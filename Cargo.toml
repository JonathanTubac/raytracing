[package]
name = "raytracer"
version = "0.1.0"
edition = "2024"

# Sin dependencias: vectores, imagenes, ventana e hilos estan hechos a mano con la
# biblioteca estandar de Rust (ver math.rs, image_io.rs, window.rs y render.rs)
[dependencies]

# Sin esto, `cargo run` (modo debug) renderiza sin optimizar y la ventana va muy lenta
[profile.dev]
opt-level = 3
